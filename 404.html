<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Redirecting…</title>
<script>
  var seg = location.pathname.split('/')[1];
  var base = location.hostname.endsWith('github.io') && seg && !location.hostname.startsWith(seg) ? '/' + seg + '/' : '/';
  location.replace(base + '#/404');
</script>
</head><body><a href="./">Go to homepage</a></body></html>
